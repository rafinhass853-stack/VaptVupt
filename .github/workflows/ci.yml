name: VaptVupt CI

# Production validation pipeline

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build --workspace=apps/functions
      - run: npm run build --workspace=apps/web-admin
      - run: npm run build --workspace=apps/web-store
      - run: npx tsc --noEmit -p apps/mobile-driver/tsconfig.json
